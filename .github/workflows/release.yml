name: Release

# Push to main with a bumped Version header, get an installable zip. The tag is
# created from the header, so there is nothing to tag by hand. Pushes that do
# not change the version are a no-op.
on:
  push:
    branches:
      - main

permissions:
  contents: write

# Two pushes in quick succession would both try to cut the same release and the
# loser would fail on an existing tag. Queue them instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      # The Version header is the only place the version is written, and
      # ACUMATICA_SYNC_VERSION is read from it. Whatever it says is what gets
      # released, so an unchanged header means there is nothing to do.
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP '^\s*\*\s*Version:\s*\K\S+' acumatica-order-payment-sync.php)
          if [ -z "$version" ]; then
            echo "::error::No Version header in acumatica-order-payment-sync.php."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released, nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new, building it."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

      # zend.assertions is -1 in the production ini setup-php installs, which
      # compiles every assert() out. The script would print "ok" without having
      # checked anything, so the flag is the difference between a gate and a
      # decoration.
      - name: Self-check
        run: php -d zend.assertions=1 test-resend-kind.php

      - name: Build zip
        run: |
          mkdir -p build/acumatica-order-payment-sync
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='build' \
            --exclude='test-resend-kind.php' \
            ./ build/acumatica-order-payment-sync/
          cd build && zip -qr ../acumatica-order-payment-sync.zip acumatica-order-payment-sync

      # gh tags the release commit itself, so the tag can never disagree with
      # the Version header it was built from.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
          gh release upload "$TAG" acumatica-order-payment-sync.zip --clobber
